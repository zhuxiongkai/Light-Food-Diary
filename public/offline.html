<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2d6a4f" />
    <title>轻卡记 - 网络不可用</title>
    <style>
      :root {
        color: #2c2420;
        background: #faf8f5;
        font-family: SimSun, "Songti SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(ellipse 80% 60% at 50% 0%, rgba(180, 150, 120, 0.1), transparent 60%),
          radial-gradient(ellipse 60% 50% at 80% 100%, rgba(45, 106, 79, 0.06), transparent 55%),
          linear-gradient(180deg, #faf8f5 0%, #f7f3ed 52%, #faf8f5 100%);
      }

      main {
        width: min(100%, 380px);
        padding: 28px 24px;
        text-align: center;
        background: rgba(255, 255, 255, 0.92);
        border: 1px solid rgba(156, 142, 132, 0.2);
        border-radius: 24px;
        box-shadow: 0 8px 32px rgba(44, 36, 32, 0.09), 0 2px 8px rgba(44, 36, 32, 0.04);
      }

      img {
        width: 78px;
        height: 78px;
        border-radius: 22px;
        box-shadow: 0 8px 24px rgba(45, 106, 79, 0.12);
      }

      h1 {
        margin: 18px 0 8px;
        color: #1a1410;
        font-size: 24px;
        line-height: 1.2;
      }

      p {
        margin: 0;
        color: #6b5e58;
        font-size: 15px;
        line-height: 1.6;
      }

      button {
        width: 100%;
        height: 46px;
        margin-top: 20px;
        color: #fff;
        background: linear-gradient(90deg, #2d6a4f 0%, #1b4332 100%);
        border: 0;
        border-radius: 14px;
        font: inherit;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/app-logo.png" alt="轻卡记" />
      <h1>暂时连不上网络</h1>
      <p>轻卡记需要联网同步饮食、体重和 AI 识别数据。请检查网络后再试。</p>
      <button type="button" onclick="window.location.reload()">重新连接</button>
    </main>
  </body>
</html>
